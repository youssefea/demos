name: Deploy Base demo previews

on:
  push:
    branches: [master]
    paths:
      - "200ms-demo/**"
      - "fighter-demo/**"
      - "fighter-ai/**"
      - ".github/workflows/deploy-200ms-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 200ms-demo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            200ms-demo/package-lock.json
            fighter-demo/package-lock.json
            fighter-ai/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test exact rate math
        run: npm run test:math

      - name: Build the /demos/200ms/ path
        run: npm run build -- --base=/demos/200ms/

      # Validate the API, but never include it in the GitHub Pages artifact.
      # Its separate Vercel deployment is managed independently.
      - name: Install Jev API dependencies
        working-directory: fighter-ai
        run: npm ci

      - name: Test and typecheck Jev API
        working-directory: fighter-ai
        run: npm test && npm run build

      - name: Install fighter dependencies
        working-directory: fighter-demo
        run: npm ci

      - name: Test Jev scheduling, combat and transfer accounting
        working-directory: fighter-demo
        run: npm test

      - name: Build the /demos/fighter/ path
        working-directory: fighter-demo
        env:
          VITE_JEV_API_URL: ${{ vars.VITE_JEV_API_URL || 'https://block-fighter-jev.vercel.app/api/decide' }}
        run: npm run build -- --base=/demos/fighter/

      - name: Assemble both demos in one Pages artifact
        run: |
          mkdir -p ../pages/200ms ../pages/fighter
          cp -R dist/. ../pages/200ms/
          cp -R ../fighter-demo/dist/. ../pages/fighter/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
