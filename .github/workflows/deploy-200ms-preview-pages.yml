name: Deploy 200ms demo preview

on:
  push:
    branches: [master]
    paths:
      - "200ms-demo/**"
      - ".github/workflows/deploy-200ms-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 200ms-demo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 200ms-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test exact rate math
        run: npm run test:math

      - name: Build the /demos/200ms/ path
        run: npm run build -- --base=/demos/200ms/

      - name: Assemble Pages artifact
        run: |
          mkdir -p ../pages/200ms
          cp -R dist/. ../pages/200ms/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
